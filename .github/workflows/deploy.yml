name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      schema: ${{ steps.filter.outputs.schema }}
      worker: ${{ steps.filter.outputs.worker }}
      webapp: ${{ steps.filter.outputs.webapp }}
      have_cf: ${{ steps.cf.outputs.have }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            schema:
              - 'schema/**'
            worker:
              - 'worker/**'
              - 'schema/**'
            webapp:
              - 'webapp/**'
              - 'schema/**'
      # Deploy jobs only run when Cloudflare credentials exist. Comparing the
      # secret to an empty string yields a boolean and never exposes its value,
      # so PRs (incl. forks) stay green until the one-time infra setup is done.
      - id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: changes
    if: needs.changes.outputs.schema == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  worker-deploy:
    needs: [changes, test]
    if: github.event_name == 'push' && needs.changes.outputs.worker == 'true' && needs.changes.outputs.have_cf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  webapp-build:
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @101/webapp build
      - uses: actions/upload-artifact@v4
        with: { name: webapp-dist, path: webapp/dist }

  webapp-preview-deploy:
    needs: [changes, webapp-build]
    if: github.event_name == 'pull_request' && needs.changes.outputs.webapp == 'true' && needs.changes.outputs.have_cf == 'true'
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      # pnpm install so wrangler-action uses the workspace wrangler; otherwise it
      # self-installs via npm, which cannot parse the "workspace:*" dependency.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: webapp-dist, path: webapp/dist }
      - name: Deploy to Pages (branch preview)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: webapp
          command: pages deploy dist --project-name=companion-101-webapp --branch=${{ github.head_ref }} --commit-dirty=true

  webapp-e2e:
    needs: [changes, webapp-preview-deploy]
    if: github.event_name == 'pull_request' && needs.changes.outputs.webapp == 'true' && needs.changes.outputs.have_cf == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: webapp } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E against branch preview
        env:
          E2E_BASE_URL: ${{ needs.webapp-preview-deploy.outputs.preview_url }}
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: webapp/playwright-report, retention-days: 7 }

  webapp-deploy:
    needs: [changes, test, webapp-build]
    if: github.event_name == 'push' && needs.changes.outputs.webapp == 'true' && needs.changes.outputs.have_cf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: webapp-dist, path: webapp/dist }
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: webapp
          command: pages deploy dist --project-name=companion-101-webapp --branch=main
